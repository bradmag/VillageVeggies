<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VillageVeggies - Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Reset your VillageVeggies account password."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <a class="header-logo" href="/index.html">VillageVeggies</a>
        <nav aria-label="Primary">
          <ul class="nav">
            <li><a href="/funding.html">Support The Movement</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main">
      <div class="auth-container">
        <div id="forgot-view">
          <h2>Reset your password</h2>
          <p>Enter the email address for your account and we'll send you a reset link.</p>
          <form id="forgotForm" class="auth-form">
            <div class="form-group">
              <label for="forgot-email">Email</label>
              <input type="email" id="forgot-email" name="email" autocomplete="email" required />
            </div>
            <button type="submit" class="auth-button">Send reset link</button>
            <p id="forgot-error" class="error"></p>
          </form>
          <p class="form-group"><a href="/login.html">Back to login</a></p>
        </div>

        <div id="success-view" hidden>
          <h2>Check your inbox</h2>
          <p>If that email is registered, you'll receive a reset link shortly.</p>
          <p><a href="/login.html">Back to login</a></p>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <small>© <span id="year"></span> VillageVeggies</small>
      </div>
    </footer>
    <script src="js/forgot-password.js" defer></script>
  </body>
</html>
