<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>VillageVeggies - Admin Inventory</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
          name="description"
          content="VillageVeggies Admin Inventory"
        />
        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    
    <body>
        <header class="header">
            <div class="header-inner">
                <a class="header-logo" href="/">VillageVeggies</a>
                <nav aria-label="Primary">
                    <ul class="nav">
                        <li><a href="/">Home</a></li>
                    </ul>
                </nav>
            </div>
        </header>
    
        <main id="main">
            <section class="admin-inv-page-hero admin-inv-hero">
                <div class="admin-inv-inner-hero admin-inv-hero-inner">
                    <p class="admin-shop-meta" id="admin-shop-name">Shop Name</p>
                    <p class="admin-shop-meta" id="admin-shop-address">Shop Address</p>
                    <p class="admin-shop-meta" id="admin-last-updated">Last Updated: <time datetime="">-</time></p>
                </div>
            </section>
            
            <section class="admin-form-section">
                <form id="inventory-form" class="inventory-form">
                    <input type="hidden" id="item-id"/>
                    <div class="inventory-form-group">
                        <label for="inventory-item">Inventory Name</label>
                        <input
                         type="text"
                         id="inventory-item"
                         name="item name"
                        />
                    </div>
                    <div class="inventory-form-group">
                        <label for="availability-type">Availability</label>
                        <select id="availability-type">
                            <option value="in-stock">In Stock</option>
                            <option value="low-stock">Low Stock</option>
                            <option value="out-of-stock">Out of Stock</option>
                        </select>
                    </div>
                    <div class="inventory-form-group">
                        <label for="quantity">Quantity</label>
                        <input
                         type="number"
                         id="quantity"
                         name="quantity"
                         min="0"
                        />
                    </div>
                    <div class="inventory-form-group">
                        <label for="price-range">Price Range</label>
                        <input 
                         type="text"
                         id="price-range"
                         name="price-range"
                        /> 
                    </div>
                    <div class="inventory-form-buttons">
                        <button type="submit" class="inventory-submit">Add Item</button>
                        <button type="button" id="cancel-edit">Cancel</button>
                    </div>
                   
                    <p id="edit-label" style="color: green; font-weight: bold;"></p>
                </form>
            </section>
            
            <section class="admin-inventory">
                <h2>INVENTORY</h2>
                <div class="admin-inventory-grid">
                    <!-- Inventory cards will be inserted here dynamically -->
                </div>
            </section>
        </main>
        <script src="/js/company-item.js" defer></script>
    </body>
</html>
