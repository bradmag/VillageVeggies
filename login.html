<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VillageVeggies - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="VillageVeggies helps Front Range plant shops keep a simple online inventory so customers can visit with confidence."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <a class="header-logo" href="/index.html">VillageVeggies</a>
        <nav aria-label="Primary">
          <ul class="nav">
            <li><a href="/funding.html">Support The Movement</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main">
      <div class="auth-container">
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="form-group">
            <a href="/forgot-password.html" class="forgot-password">Forgot my password</a>
          </div>
          <button type="submit" class="auth-button">Login</button>
          <p id="login-error" class="error"></p>
        </form>
        <p class="form-group"><a href="/register.html">Don't have an account? Register here</a></p>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <small>© <span id="year"></span> VillageVeggies</small>
      </div>
    </footer>
    <script src="js/login.js" defer></script>
  </body>
</html>
