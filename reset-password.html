<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VillageVeggies - Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Set a new password for your VillageVeggies account."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <a class="header-logo" href="/index.html">VillageVeggies</a>
        <nav aria-label="Primary">
          <ul class="nav">
            <li><a href="/funding.html">Support The Movement</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main">
      <div class="auth-container">

        <!-- Shown while the token is being validated -->
        <div id="loading-view">
          <p>Validating your reset link…</p>
        </div>

        <!-- Shown when the token is valid -->
        <div id="reset-view" hidden>
          <h2>Set a new password</h2>
          <form id="resetForm" class="auth-form">
            <div class="form-group">
              <label for="new-password">New Password</label>
              <input
                type="password"
                id="new-password"
                name="newPassword"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm Password</label>
              <input
                type="password"
                id="confirm-password"
                name="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </div>
            <button type="submit" class="auth-button">Update password</button>
            <p id="reset-error" class="error"></p>
          </form>
        </div>

        <!-- Shown on invalid/expired token or after success -->
        <div id="message-view" hidden>
          <p id="message-text"></p>
          <p><a href="/login.html">Back to login</a></p>
        </div>

      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <small>© <span id="year"></span> VillageVeggies</small>
      </div>
    </footer>
    <script src="js/reset-password.js" defer></script>
  </body>
</html>
