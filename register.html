<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VillageVeggies - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Create a VillageVeggies account to list your plant shop and manage your inventory."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <a class="header-logo" href="/index.html">VillageVeggies</a>
        <nav aria-label="Primary">
          <ul class="nav">
            <li><a href="/funding.html">Support The Movement</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main">
      <div class="auth-container">
        <h2>Create your shop account</h2>
        <div id="form-errors" class="form-errors" role="alert" aria-live="polite" hidden></div>
        <form id="registerForm" class="auth-form">
          <div class="form-group">
            <label for="register-email">Email</label>
            <input
              type="email"
              id="register-email"
              name="email"
              autocomplete="email"
              required
            />
            <p class="error" data-for="email"></p>
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input
              type="password"
              id="register-password"
              name="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <p class="error" data-for="password"></p>
          </div>
          <div class="form-group">
            <label for="confirm-password">Verify Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <p class="error" data-for="confirmPassword"></p>
          </div>
          <div class="form-group">
            <label for="register-name">Shop Name</label>
            <input type="text" id="register-name" name="name" required />
            <p class="error" data-for="name"></p>
          </div>
          <div class="form-group">
            <label for="register-address">Address</label>
            <input
              type="text"
              id="register-address"
              name="address"
              inputmode="text"
              autocomplete="street-address"
              required
            />
            <p class="error" data-for="address"></p>
          </div>
          <button type="submit" class="auth-button">Register</button>
        </form>
        <p class="form-group"><a href="/login.html">Already have an account? Log in</a></p>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <small>© <span id="year"></span> VillageVeggies</small>
      </div>
    </footer>
    <script src="js/register.js" defer></script>
  </body>
</html>
